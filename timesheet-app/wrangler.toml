# 作業日報 単独サイト用 Cloudflare Workers 設定
# `npm run build` で out/ を生成 → `npx wrangler deploy` でこの設定を読み配信・API公開
# 既存の「blocky」サイトとは別のWorkerとしてデプロイされます（デプロイ後のURLは別になります）。

name = "blocky-timesheet"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# 静的サイト（out/）を配信。/api 以外はアセットが直接配信される
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 既存サイトと同じデータベースを共有（ts_users / ts_entries テーブルを使用。
# 既存の売上管理データ等とはテーブルが分かれているので混ざりません）
[[d1_databases]]
binding = "DB"
database_name = "genba-kakeibo"
database_id = "68a56050-be1a-4509-af43-63bf6e795ad4"
